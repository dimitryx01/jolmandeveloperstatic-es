<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 | Jolman Developer</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <!--
      GitHub Pages sirve este archivo con estado HTTP 404 para cualquier URL inexistente.
      Todas las rutas válidas están pre-renderizadas (scripts/prerender.mjs), así que ya no
      hace falta el truco de redirección a /?/ruta: una URL que no existe es un 404 real.
    -->
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #0a0a23; color: #e5e7eb; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      main { text-align: center; padding: 1.5rem; max-width: 32rem; }
      h1 { font-size: 3rem; margin: 0 0 .5rem; }
      p { color: #9ca3af; line-height: 1.6; margin: .25rem 0; }
      a { color: #2dd4bf; }
      .links { margin-top: 1.5rem; display: flex; gap: 1.25rem; justify-content: center; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>La página que buscas no existe o ha cambiado de dirección.</p>
      <p lang="en">The page you are looking for does not exist or has moved.</p>
      <div class="links">
        <a href="/es/">Ir al inicio</a>
        <a href="/en/" lang="en" hreflang="en">Go to the home page</a>
      </div>
    </main>
  </body>
</html>
